<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小米商城 - 登录/注册</title>
    <!-- 引入重置样式 -->
    <link rel="stylesheet" href="css/reset.css">
    <style>
        /* 全局背景 - 小米风格渐变 */
        body {
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft Yahei", sans-serif;
        }

        /* 登录容器 */
        .login-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 登录卡片 */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            animation: fadeInUp 0.5s ease-out;
        }

        /* 头部区域 - 小米Logo */
        .login-header {
            padding: 32px 40px 16px;
            position: relative;
            text-align: center;
        }

        /* Logo图片 - 固定在左边，靠近文字 */
        .logo-img {
            position: absolute;
            left: 115px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 文字部分 - 居中 */
        .logo-text {
            font-size: 24px;
            font-weight: 500;
            color: #ff6700;
            letter-spacing: 1px;
            display: inline-block;
        }

        .logo-text span {
            font-weight: 400;
            color: #333;
        }

        .subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
            text-align: center;
        }

        /* Tab切换 */
        .login-tabs {
            display: flex;
            border-bottom: 1px solid #eee;
            padding: 0 40px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 16px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .tab-item.active {
            color: #ff6700;
            font-weight: 500;
        }

        .tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: #ff6700;
        }

        /* 表单区域 */
        .login-form {
            padding: 32px 40px 48px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.3s;
            background: #fafafa;
        }

        .input-wrapper:focus-within {
            border-color: #ff6700;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(255, 103, 0, 0.1);
        }

        .input-icon {
            padding: 0 12px;
            color: #bbb;
            font-size: 18px;
        }

        .input-wrapper input {
            flex: 1;
            padding: 14px 12px 14px 0;
            border: none;
            background: transparent;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input::placeholder {
            color: #ccc;
        }

        /* 验证码行 */
        .captcha-row {
            display: flex;
            gap: 12px;
        }

        .captcha-row .input-wrapper {
            flex: 1;
        }

        .captcha-img {
            width: 120px;
            height: 48px;
            background: #f0f0f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: #ff6700;
            cursor: pointer;
            border: 1px solid #e0e0e0;
        }

        /* 额外选项 */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #666;
            cursor: pointer;
        }

        .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #ff6700;
        }

        .forgot-link {
            color: #999;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #ff6700;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #ff6700;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            background: #f85c00;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 103, 0, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        /* 其他登录方式 */
        .other-login {
            text-align: center;
            border-top: 1px solid #eee;
            padding-top: 24px;
            margin-top: 8px;
        }

        .other-login p {
            font-size: 12px;
            color: #999;
            margin-bottom: 16px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 20px;
        }

        .social-icon:hover {
            background: #ff6700;
            color: white;
            transform: translateY(-2px);
        }

        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #666;
        }

        .register-link a {
            color: #ff6700;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* 错误提示 */
        .error-message {
            color: #e4393c;
            font-size: 12px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* ========== 注册弹窗样式 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .register-modal {
            background: #fff;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            overflow: hidden;
        }

        .modal-overlay.active .register-modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 0 24px 32px;
            text-align: center;
        }

        .modal-footer .login-btn {
            margin-bottom: 0;
        }

        /* 协议勾选 */
        .agreement {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #999;
            margin-top: 16px;
        }

        .agreement a {
            color: #ff6700;
        }

        /* 密码强度提示 */
        .password-strength {
            font-size: 12px;
            margin-top: 6px;
        }

        .strength-text {
            color: #999;
        }

        .strength-text.weak { color: #e4393c; }
        .strength-text.medium { color: #ffa500; }
        .strength-text.strong { color: #4caf50; }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .login-header {
                padding: 32px 24px 16px;
            }
            .logo-img {
                left: 75px;
            }
            .login-form {
                padding: 24px 24px 32px;
            }
            .login-tabs {
                padding: 0 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- 头部 -->
            <div class="login-header">
                <img src="images/小米logo.jpg" alt="小米Logo" class="logo-img">
                <span class="logo-text">小米<span>商城</span></span>
                <div class="subtitle">探索科技美好生活</div>
            </div>

            <!-- Tab 切换 -->
            <div class="login-tabs">
                <div class="tab-item active" data-tab="account">账号登录</div>
                <div class="tab-item" data-tab="sms">短信登录</div>
            </div>

            <!-- 账号登录表单 -->
            <div class="login-form" id="accountForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="text" id="username" placeholder="手机号 / 邮箱 / 小米ID">
                    </div>
                    <div class="error-message" id="usernameError">请输入有效的账号</div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" placeholder="密码">
                    </div>
                    <div class="error-message" id="passwordError">请输入密码</div>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberMe"> 记住密码
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>

                <button class="login-btn" id="loginBtn">登录</button>

                <div class="other-login">
                    <p>其他登录方式</p>
                    <div class="social-icons">
                        <div class="social-icon">📱</div>
                        <div class="social-icon">💬</div>
                        <div class="social-icon">🍎</div>
                    </div>
                </div>

                <div class="register-link">
                    还没有账号？ <a href="#" id="openRegisterBtn">立即注册</a>
                </div>
            </div>

            <!-- 短信登录表单（初始隐藏） -->
            <div class="login-form" id="smsForm" style="display: none;">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="phone" placeholder="手机号码">
                    </div>
                    <div class="error-message" id="phoneError">请输入正确的手机号</div>
                </div>

                <div class="form-group">
                    <div class="captcha-row">
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="text" id="smsCode" placeholder="验证码">
                        </div>
                        <div class="captcha-img" id="getSmsBtn">获取验证码</div>
                    </div>
                    <div class="error-message" id="smsError">请输入验证码</div>
                </div>

                <button class="login-btn" id="smsLoginBtn">登录</button>

                <div class="other-login">
                    <p>其他登录方式</p>
                    <div class="social-icons">
                        <div class="social-icon">📱</div>
                        <div class="social-icon">💬</div>
                        <div class="social-icon">🍎</div>
                    </div>
                </div>

                <div class="register-link">
                    还没有账号？ <a href="#" id="openRegisterBtn2">立即注册</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal-overlay" id="registerModal">
        <div class="register-modal">
            <div class="modal-header">
                <h3>注册小米账号</h3>
                <div class="modal-close" id="closeRegisterBtn">✕</div>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="regPhone" placeholder="手机号码">
                    </div>
                    <div class="error-message" id="regPhoneError">请输入正确的11位手机号</div>
                </div>

                <div class="form-group">
                    <div class="captcha-row">
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input type="text" id="regSmsCode" placeholder="短信验证码">
                        </div>
                        <div class="captcha-img" id="getRegSmsBtn">获取验证码</div>
                    </div>
                    <div class="error-message" id="regSmsError">请输入验证码</div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="regPassword" placeholder="设置密码">
                    </div>
                    <div class="password-strength">
                        <span class="strength-text" id="strengthText">密码强度：未设置</span>
                    </div>
                    <div class="error-message" id="regPasswordError">密码长度至少8位，需包含字母和数字</div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon">✓</span>
                        <input type="password" id="regConfirmPassword" placeholder="确认密码">
                    </div>
                    <div class="error-message" id="regConfirmError">两次输入的密码不一致</div>
                </div>

                <label class="checkbox agreement">
                    <input type="checkbox" id="agreeTerms"> 我已阅读并同意
                    <a href="#">《小米用户协议》</a> 和
                    <a href="#">《隐私政策》</a>
                </label>
            </div>
            <div class="modal-footer">
                <button class="login-btn" id="registerBtn">立即注册</button>
            </div>
        </div>
    </div>

    <script>
        // ========== DOM 元素获取 ==========
        // Tab 切换
        const tabItems = document.querySelectorAll('.tab-item');
        const accountForm = document.getElementById('accountForm');
        const smsForm = document.getElementById('smsForm');

        // 账号登录元素
        const username = document.getElementById('username');
        const password = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const usernameError = document.getElementById('usernameError');
        const passwordError = document.getElementById('passwordError');
        const rememberMe = document.getElementById('rememberMe');

        // 短信登录元素
        const phone = document.getElementById('phone');
        const smsCode = document.getElementById('smsCode');
        const smsLoginBtn = document.getElementById('smsLoginBtn');
        const phoneError = document.getElementById('phoneError');
        const smsError = document.getElementById('smsError');
        const getSmsBtn = document.getElementById('getSmsBtn');

        // 注册弹窗元素
        const registerModal = document.getElementById('registerModal');
        const openRegisterBtns = document.querySelectorAll('#openRegisterBtn, #openRegisterBtn2');
        const closeRegisterBtn = document.getElementById('closeRegisterBtn');
        const regPhone = document.getElementById('regPhone');
        const regSmsCode = document.getElementById('regSmsCode');
        const regPassword = document.getElementById('regPassword');
        const regConfirmPassword = document.getElementById('regConfirmPassword');
        const getRegSmsBtn = document.getElementById('getRegSmsBtn');
        const registerBtn = document.getElementById('registerBtn');
        const agreeTerms = document.getElementById('agreeTerms');

        // 错误提示元素
        const regPhoneError = document.getElementById('regPhoneError');
        const regSmsError = document.getElementById('regSmsError');
        const regPasswordError = document.getElementById('regPasswordError');
        const regConfirmError = document.getElementById('regConfirmError');
        const strengthText = document.getElementById('strengthText');

        // ========== 手机号验证函数 ==========
        // 验证手机号（严格的11位判断）
        function isValidPhone(phoneNum) {
            const phone = String(phoneNum).trim();
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }

        // 获取手机号格式错误提示文字
        function getPhoneErrorMsg(phoneNum) {
            const phone = String(phoneNum).trim();
            if (!phone) return '手机号不能为空';
            if (phone.length !== 11) return `手机号必须是11位（当前${phone.length}位）`;
            if (!/^\d+$/.test(phone)) return '手机号只能包含数字';
            if (!/^1/.test(phone)) return '手机号必须以1开头';
            return '请输入正确的手机号格式';
        }

        // 验证密码强度（至少8位，包含字母和数字）
        function getPasswordStrength(pwd) {
            if (!pwd) return { level: 0, text: '未设置' };
            const hasLetter = /[a-zA-Z]/.test(pwd);
            const hasNumber = /\d/.test(pwd);
            const hasSpecial = /[!@#$%^&*]/.test(pwd);
            const length = pwd.length;
            
            if (length < 6) return { level: 0, text: '太短', className: 'weak' };
            if (length >= 8 && hasLetter && hasNumber && hasSpecial) return { level: 3, text: '强', className: 'strong' };
            if (length >= 6 && ((hasLetter && hasNumber) || (hasLetter && hasSpecial) || (hasNumber && hasSpecial))) return { level: 2, text: '中', className: 'medium' };
            if (length >= 6) return { level: 1, text: '弱', className: 'weak' };
            return { level: 0, text: '弱', className: 'weak' };
        }

        // 检查密码强度
        function checkPasswordStrength() {
            const pwd = regPassword.value;
            const strength = getPasswordStrength(pwd);
            strengthText.textContent = `密码强度：${strength.text}`;
            strengthText.className = `strength-text ${strength.className || ''}`;
            return strength.level >= 1;
        }

        // 验证登录（增强版：区分"账号不存在"和"密码错误"）
        function validateLogin(phoneOrUsername, pwd) {
            const users = JSON.parse(localStorage.getItem('mi_users') || '[]');
            const user = users.find(u => u.phone === phoneOrUsername);
            
            if (!user) {
                return { success: false, reason: 'not_exist' };
            }
            if (user.password !== pwd) {
                return { success: false, reason: 'wrong_password' };
            }
            return { success: true, reason: 'success' };
        }

        // 保存用户到 localStorage
        function saveUser(phoneNum, password) {
            const users = JSON.parse(localStorage.getItem('mi_users') || '[]');
            const exists = users.find(u => u.phone === phoneNum);
            if (exists) {
                alert('该手机号已注册，请直接登录');
                return false;
            }
            users.push({
                phone: phoneNum,
                password: password,
                registerTime: new Date().toISOString()
            });
            localStorage.setItem('mi_users', JSON.stringify(users));
            return true;
        }

        // 验证注册表单（增强手机号验证）
        function validateRegister() {
            let isValid = true;
            
            // 验证手机号（严格11位）
            const phoneValue = regPhone.value.trim();
            if (!phoneValue) {
                regPhoneError.textContent = '手机号不能为空';
                regPhoneError.classList.add('show');
                isValid = false;
            } else if (!isValidPhone(phoneValue)) {
                regPhoneError.textContent = getPhoneErrorMsg(phoneValue);
                regPhoneError.classList.add('show');
                isValid = false;
            } else {
                regPhoneError.classList.remove('show');
            }
            
            // 验证验证码
            if (!regSmsCode.value || regSmsCode.value !== '8888') {
                regSmsError.classList.add('show');
                isValid = false;
            } else {
                regSmsError.classList.remove('show');
            }
            
            // 验证密码
            const pwd = regPassword.value;
            const strength = getPasswordStrength(pwd);
            if (pwd.length < 8 || strength.level < 1) {
                regPasswordError.classList.add('show');
                isValid = false;
            } else {
                regPasswordError.classList.remove('show');
            }
            
            // 验证确认密码
            if (regConfirmPassword.value !== pwd) {
                regConfirmError.classList.add('show');
                isValid = false;
            } else {
                regConfirmError.classList.remove('show');
            }
            
            // 验证协议勾选
            if (!agreeTerms.checked) {
                alert('请阅读并同意用户协议和隐私政策');
                isValid = false;
            }
            
            return isValid;
        }

        // 验证账号登录表单
        function validateAccount() {
            let isValid = true;
            if (!username.value.trim()) {
                usernameError.classList.add('show');
                isValid = false;
            } else {
                usernameError.classList.remove('show');
            }
            if (!password.value) {
                passwordError.classList.add('show');
                isValid = false;
            } else {
                passwordError.classList.remove('show');
            }
            return isValid;
        }

        // 验证短信登录表单
        function validatePhoneLogin() {
            let isValid = true;
            const phoneValue = phone.value.trim();
            
            if (!phoneValue) {
                phoneError.textContent = '手机号不能为空';
                phoneError.classList.add('show');
                isValid = false;
            } else if (!isValidPhone(phoneValue)) {
                phoneError.textContent = getPhoneErrorMsg(phoneValue);
                phoneError.classList.add('show');
                isValid = false;
            } else {
                phoneError.classList.remove('show');
            }
            
            if (!smsCode.value || smsCode.value !== '8888') {
                smsError.classList.add('show');
                isValid = false;
            } else {
                smsError.classList.remove('show');
            }
            
            return isValid;
        }

        // ========== Tab 切换 ==========
        tabItems.forEach(tab => {
            tab.addEventListener('click', function() {
                tabItems.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const tabType = this.getAttribute('data-tab');
                if (tabType === 'account') {
                    accountForm.style.display = 'block';
                    smsForm.style.display = 'none';
                } else {
                    accountForm.style.display = 'none';
                    smsForm.style.display = 'block';
                }
            });
        });

        // ========== 账号登录处理 ==========
        loginBtn.addEventListener('click', function() {
            if (validateAccount()) {
                const result = validateLogin(username.value.trim(), password.value);
                
                if (result.success) {
                    this.textContent = '登录中...';
                    this.disabled = true;
                    setTimeout(() => {
                        if (rememberMe.checked) {
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('currentUser', username.value);
                        } else {
                            sessionStorage.setItem('isLoggedIn', 'true');
                            sessionStorage.setItem('currentUser', username.value);
                        }
                        alert('登录成功！正在进入小米商城...');
                        window.location.href = 'index.html';
                        this.textContent = '登录';
                        this.disabled = false;
                    }, 800);
                } else {
                    if (result.reason === 'not_exist') {
                        const confirmRegister = confirm(
                            `账号 "${username.value}" 不存在\n\n是否立即注册？`
                        );
                        if (confirmRegister) {
                            registerModal.classList.add('active');
                            if (regPhone) regPhone.value = username.value;
                        }
                    } else if (result.reason === 'wrong_password') {
                        alert('密码错误，请重新输入');
                        password.value = '';
                        password.focus();
                    }
                }
            }
        });

        // ========== 短信登录处理 ==========
        smsLoginBtn.addEventListener('click', function() {
            if (validatePhoneLogin()) {
                const result = validateLogin(phone.value.trim(), '12345678');
                
                if (result.success) {
                    this.textContent = '登录中...';
                    this.disabled = true;
                    setTimeout(() => {
                        sessionStorage.setItem('isLoggedIn', 'true');
                        sessionStorage.setItem('currentUser', phone.value);
                        alert('登录成功！正在进入小米商城...');
                        window.location.href = 'index.html';
                        this.textContent = '登录';
                        this.disabled = false;
                    }, 800);
                } else {
                    if (result.reason === 'not_exist') {
                        const confirmRegister = confirm(
                            `手机号 "${phone.value}" 未注册\n\n是否立即注册？`
                        );
                        if (confirmRegister) {
                            registerModal.classList.add('active');
                            if (regPhone) regPhone.value = phone.value;
                        }
                    } else {
                        alert('登录失败，请重试');
                    }
                }
            }
        });

        // ========== 短信登录获取验证码 ==========
        let countdown = 0;
        getSmsBtn.addEventListener('click', function() {
            if (countdown > 0) return;
            
            const phoneValue = phone.value.trim();
            
            if (!phoneValue) {
                phoneError.textContent = '请先输入手机号';
                phoneError.classList.add('show');
                return;
            }
            if (!isValidPhone(phoneValue)) {
                phoneError.textContent = getPhoneErrorMsg(phoneValue);
                phoneError.classList.add('show');
                return;
            }
            
            phoneError.classList.remove('show');
            alert('验证码已发送：8888（演示专用）');
            smsCode.value = '8888';
            
            countdown = 60;
            this.textContent = `${countdown}秒后重试`;
            const timer = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    clearInterval(timer);
                    getSmsBtn.textContent = '获取验证码';
                    countdown = 0;
                } else {
                    getSmsBtn.textContent = `${countdown}秒后重试`;
                }
            }, 1000);
        });

        // 短信登录手机号实时验证
        phone.addEventListener('input', function() {
            const phoneValue = this.value.trim();
            
            if (!phoneValue) {
                phoneError.textContent = '手机号不能为空';
                phoneError.classList.add('show');
            } else if (phoneValue.length !== 11) {
                phoneError.textContent = `手机号必须是11位（当前${phoneValue.length}位）`;
                phoneError.classList.add('show');
            } else if (!/^\d+$/.test(phoneValue)) {
                phoneError.textContent = '手机号只能包含数字';
                phoneError.classList.add('show');
            } else if (!isValidPhone(phoneValue)) {
                phoneError.textContent = '请输入正确的手机号格式';
                phoneError.classList.add('show');
            } else {
                phoneError.classList.remove('show');
            }
        });

        // ========== 注册弹窗逻辑 ==========
        // 打开弹窗
        openRegisterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                registerModal.classList.add('active');
                // 重置表单
                regPhone.value = '';
                regSmsCode.value = '';
                regPassword.value = '';
                regConfirmPassword.value = '';
                agreeTerms.checked = false;
                strengthText.textContent = '密码强度：未设置';
                strengthText.className = 'strength-text';
                // 清除错误提示
                [regPhoneError, regSmsError, regPasswordError, regConfirmError].forEach(el => {
                    el.classList.remove('show');
                });
            });
        });

        // 关闭弹窗
        closeRegisterBtn.addEventListener('click', () => {
            registerModal.classList.remove('active');
        });
        registerModal.addEventListener('click', (e) => {
            if (e.target === registerModal) {
                registerModal.classList.remove('active');
            }
        });

        // 注册页面手机号实时验证
        regPhone.addEventListener('input', function() {
            const phoneValue = this.value.trim();
            
            if (!phoneValue) {
                regPhoneError.textContent = '手机号不能为空';
                regPhoneError.classList.add('show');
            } else if (phoneValue.length !== 11) {
                regPhoneError.textContent = `手机号必须是11位（当前${phoneValue.length}位）`;
                regPhoneError.classList.add('show');
            } else if (!/^\d+$/.test(phoneValue)) {
                regPhoneError.textContent = '手机号只能包含数字';
                regPhoneError.classList.add('show');
            } else if (!isValidPhone(phoneValue)) {
                regPhoneError.textContent = '请输入正确的手机号格式';
                regPhoneError.classList.add('show');
            } else {
                regPhoneError.classList.remove('show');
            }
        });

        regPhone.addEventListener('blur', function() {
            const phoneValue = this.value.trim();
            if (!isValidPhone(phoneValue) && phoneValue) {
                regPhoneError.textContent = getPhoneErrorMsg(phoneValue);
                regPhoneError.classList.add('show');
            }
        });

        // 注册页面获取验证码
        let regCountdown = 0;
        getRegSmsBtn.addEventListener('click', function() {
            if (regCountdown > 0) return;
            
            const phoneValue = regPhone.value.trim();
            
            if (!phoneValue) {
                regPhoneError.textContent = '请先输入手机号';
                regPhoneError.classList.add('show');
                return;
            }
            if (!isValidPhone(phoneValue)) {
                regPhoneError.textContent = getPhoneErrorMsg(phoneValue);
                regPhoneError.classList.add('show');
                return;
            }
            
            regPhoneError.classList.remove('show');
            alert('验证码已发送：8888（演示专用）');
            regSmsCode.value = '8888';
            
            regCountdown = 60;
            this.textContent = `${regCountdown}秒后重试`;
            const timer = setInterval(() => {
                regCountdown--;
                if (regCountdown <= 0) {
                    clearInterval(timer);
                    getRegSmsBtn.textContent = '获取验证码';
                    regCountdown = 0;
                } else {
                    getRegSmsBtn.textContent = `${regCountdown}秒后重试`;
                }
            }, 1000);
        });

        // 密码强度实时检测
        regPassword.addEventListener('input', checkPasswordStrength);

        // 注册提交
        registerBtn.addEventListener('click', function() {
            if (validateRegister()) {
                if (saveUser(regPhone.value.trim(), regPassword.value)) {
                    alert('注册成功！请登录');
                    registerModal.classList.remove('active');
                    // 自动填充登录信息
                    username.value = regPhone.value.trim();
                    password.value = regPassword.value;
                }
            }
        });

        // 输入时清除错误提示
        username.addEventListener('input', () => usernameError.classList.remove('show'));
        password.addEventListener('input', () => passwordError.classList.remove('show'));
        smsCode.addEventListener('input', () => smsError.classList.remove('show'));
        regSmsCode.addEventListener('input', () => regSmsError.classList.remove('show'));
        regConfirmPassword.addEventListener('input', () => regConfirmError.classList.remove('show'));

        // 回车登录
        username.addEventListener('keypress', (e) => e.key === 'Enter' && loginBtn.click());
        password.addEventListener('keypress', (e) => e.key === 'Enter' && loginBtn.click());
        phone.addEventListener('keypress', (e) => e.key === 'Enter' && smsLoginBtn.click());
        smsCode.addEventListener('keypress', (e) => e.key === 'Enter' && smsLoginBtn.click());
    </script>
</body>
</html>
