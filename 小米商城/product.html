<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>商品详情 - 小米商城</title>
    <link rel="stylesheet" href="css/reset.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, "Microsoft Yahei", sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 1226px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* ========== 顶部导航栏 ========== */
        .top-bar {
            background: #333;
            color: #999;
            font-size: 12px;
            padding: 8px 0;
        }

        .top-bar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-links a, .user-links a {
            color: #b0b0b0;
            text-decoration: none;
            margin: 0 5px;
        }

        .top-links a:hover, .user-links a:hover {
            color: #ff6700;
        }

        .separator {
            color: #424242;
            margin: 0 5px;
        }

        /* ========== 主头部 ========== */
        .main-header {
            background: #fff;
            padding: 22px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .main-header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            color: #ff6700;
        }

        .logo-text span {
            color: #333;
            font-weight: 400;
        }

        .cart-icon {
            position: relative;
            font-size: 24px;
            cursor: pointer;
            color: #333;
            text-decoration: none;
        }

        .cart-icon:hover {
            color: #ff6700;
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -12px;
            background: #ff6700;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 20px;
            min-width: 18px;
            text-align: center;
        }

        /* ========== 面包屑导航 ========== */
        .breadcrumb {
            padding: 20px 0;
            font-size: 12px;
            color: #999;
        }

        .breadcrumb a {
            color: #666;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: #ff6700;
        }

        .breadcrumb span {
            margin: 0 5px;
        }

        /* ========== 商品详情主区域 ========== */
        .product-detail {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* 左侧图片区域 */
        .product-gallery {
            flex: 1;
            min-width: 300px;
        }

        .main-image {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #f5f5f5;
            margin-bottom: 15px;
        }

        .main-image img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        .thumb-list {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .thumb-item {
            width: 70px;
            height: 70px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .thumb-item.active {
            border-color: #ff6700;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 右侧信息区域 */
        .product-info {
            flex: 1;
            min-width: 300px;
        }

        .product-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .product-subtitle {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .price-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .price-label {
            font-size: 14px;
            color: #999;
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 32px;
            font-weight: 600;
            color: #ff6700;
        }

        .price-value small {
            font-size: 14px;
        }

        .original-price {
            font-size: 14px;
            color: #999;
            text-decoration: line-through;
            margin-left: 10px;
        }

        .sales-info {
            display: flex;
            gap: 30px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* 规格选择 */
        .spec-section {
            margin-bottom: 20px;
        }

        .spec-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .spec-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .spec-option {
            padding: 8px 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: #fff;
            transition: all 0.3s;
        }

        .spec-option:hover {
            border-color: #ff6700;
        }

        .spec-option.active {
            border-color: #ff6700;
            color: #ff6700;
        }

        /* 数量选择 */
        .quantity-section {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .quantity-label {
            font-size: 14px;
            color: #666;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .quantity-btn {
            width: 36px;
            height: 36px;
            background: #f5f5f5;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: #e0e0e0;
        }

        .quantity-input {
            width: 50px;
            height: 36px;
            text-align: center;
            border: none;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
            font-size: 14px;
        }

        .quantity-input:focus {
            outline: none;
        }

        /* 按钮区域 */
        .action-buttons {
            display: flex;
            gap: 20px;
        }

        .btn-cart {
            flex: 1;
            padding: 14px;
            background: #ff6700;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cart:hover {
            background: #f85c00;
            transform: translateY(-1px);
        }

        .btn-buy {
            flex: 1;
            padding: 14px;
            background: #333;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-buy:hover {
            background: #555;
            transform: translateY(-1px);
        }

        /* 商品详情描述 */
        .product-description {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .desc-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ff6700;
        }

        .desc-content {
            line-height: 1.8;
            color: #666;
        }

        /* 底部 Footer */
        .footer {
            background: #fff;
            margin-top: 40px;
            padding: 40px 0 20px;
            border-top: 1px solid #eee;
        }

        .footer-links {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 30px;
            margin-bottom: 30px;
        }

        .footer-col h4 {
            font-size: 14px;
            margin-bottom: 15px;
            color: #333;
        }

        .footer-col a {
            display: block;
            color: #999;
            text-decoration: none;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .footer-col a:hover {
            color: #ff6700;
        }

        .copyright {
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }

        /* 提示消息 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .product-detail {
                flex-direction: column;
            }
            .footer-links {
                grid-template-columns: repeat(2, 1fr);
            }
            .action-buttons {
                flex-direction: column;
            }
            .product-title {
                font-size: 20px;
            }
            .price-value {
                font-size: 26px;
            }
        }
    </style>
</head>

            }, 2000);
        }

        // 更新购物车数量显示
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('shoppingCart') || '[]');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCountSpan = document.getElementById('cartCount');
            if (cartCountSpan) {
                cartCountSpan.textContent = totalCount;
            }
        }

        // 渲染商品详情
        function renderProductDetail() {
            if (!currentProduct) return;

            // 基本信息
            document.title = `${currentProduct.name} - 小米商城`;
            document.getElementById('productNameBreadcrumb').textContent = currentProduct.name;
            document.getElementById('productTitle').textContent = currentProduct.name;
            document.getElementById('productSubtitle').textContent = currentProduct.subtitle || '探索科技美好生活';
            document.getElementById('productPrice').innerHTML = `¥${currentProduct.price.toLocaleString()}`;
            document.getElementById('salesCount').textContent = `月销 ${currentProduct.sales}+`;
            document.getElementById('reviewCount').textContent = `评价 ${currentProduct.reviews}+`;
            document.getElementById('productDesc').textContent = currentProduct.desc || '暂无详细描述';
            
            if (currentProduct.originalPrice) {
                document.getElementById('originalPrice').innerHTML = `¥${currentProduct.originalPrice.toLocaleString()}`;
            } else {
                document.getElementById('originalPrice').innerHTML = '';
            }

            // 主图
            const mainImage = document.getElementById('mainImage');
            mainImage.src = currentProduct.image;
            mainImage.alt = currentProduct.name;

            // 生成缩略图
            const thumbList = document.getElementById('thumbList');
            const images = [currentProduct.image];
            thumbList.innerHTML = images.map((img, idx) => `
                <div class="thumb-item ${idx === 0 ? 'active' : ''}" data-img="${img}">
                    <img src="${img}" alt="缩略图">
                </div>
            `).join('');

            // 缩略图点击切换
            document.querySelectorAll('.thumb-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    mainImage.src = this.dataset.img;
                });
            });

            // 规格选项
            const specOptions = document.getElementById('specOptions');
            if (currentProduct.specs && currentProduct.specs.length > 0) {
                selectedSpec = currentProduct.specs[0];
                specOptions.innerHTML = currentProduct.specs.map(spec => `
                    <div class="spec-option ${spec === selectedSpec ? 'active' : ''}" data-spec="${spec}">${spec}</div>
                `).join('');
                
                document.querySelectorAll('.spec-option').forEach(option => {
                    option.addEventListener('click', function() {
                        document.querySelectorAll('.spec-option').forEach(o => o.classList.remove('active'));
                        this.classList.add('active');
                        selectedSpec = this.dataset.spec;
                    });
                });
            } else {
                specOptions.innerHTML = '<div class="spec-option active">标准版</div>';
                selectedSpec = '标准版';
            }

            // 设置分类链接
            const categoryLink = document.getElementById('categoryLink');
            if (currentProduct.category) {
                categoryLink.textContent = currentProduct.category;
                categoryLink.href = '#';
            }
        }

        // 加入购物车
        function addToCart() {
            if (!currentProduct) return;
            
            const cart = JSON.parse(localStorage.getItem('shoppingCart') || '[]');
            const existingIndex = cart.findIndex(item => item.id === currentProduct.id && item.spec === selectedSpec);
            
            if (existingIndex !== -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    id: currentProduct.id,
                    name: currentProduct.name,
                    price: currentProduct.price,
                    image: currentProduct.image,
                    spec: selectedSpec,
                    quantity: quantity
                });
            }
            
            localStorage.setItem('shoppingCart', JSON.stringify(cart));
            updateCartCount();
            showToast(`已添加 ${currentProduct.name} ${selectedSpec} x${quantity} 到购物车`);
        }

        // 立即购买
        function buyNow() {
            addToCart();
            setTimeout(() => {
                window.location.href = 'cart.html';
            }, 500);
        }

        // 数量控制
        function initQuantityControl() {
            const decreaseBtn = document.getElementById('decreaseBtn');
            const increaseBtn = document.getElementById('increaseBtn');
            const quantityInput = document.getElementById('quantityInput');
            
            decreaseBtn.addEventListener('click', () => {
                let val = parseInt(quantityInput.value) || 1;
                if (val > 1) {
                    val--;
                    quantityInput.value = val;
                    quantity = val;
                }
            });
            
            increaseBtn.addEventListener('click', () => {
                let val = parseInt(quantityInput.value) || 1;
                if (val < 99) {
                    val++;
                    quantityInput.value = val;
                    quantity = val;
                }
            });
            
            quantityInput.addEventListener('change', () => {
                let val = parseInt(quantityInput.value) || 1;
                if (val < 1) val = 1;
                if (val > 99) val = 99;
                quantityInput.value = val;
                quantity = val;
            });
            
            quantity = parseInt(quantityInput.value);
        }

        // 检查登录状态
        function checkLoginStatus() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') || sessionStorage.getItem('isLoggedIn');
            const currentUser = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
            const userNameSpan = document.getElementById('userNameDisplay');
            
            if (isLoggedIn && currentUser) {
                if (userNameSpan) {
                    userNameSpan.textContent = currentUser;
                    userNameSpan.href = '#';
                }
            } else {
                window.location.href = 'login.html';
            }
        }

        // 退出登录
        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('currentUser');
                sessionStorage.removeItem('isLoggedIn');
                sessionStorage.removeItem('currentUser');
                window.location.href = 'login.html';
            });
        }

        // 页面初始化
        function init() {
            checkLoginStatus();
            updateCartCount();
            
            const productId = getUrlParam('id');
            if (productId && productsData[productId]) {
                currentProductId = productId;
                currentProduct = productsData[productId];
                renderProductDetail();
                initQuantityControl();
            } else {
                window.location.href = 'index.html';
            }
            
            document.getElementById('addToCartBtn').addEventListener('click', addToCart);
            document.getElementById('buyNowBtn').addEventListener('click', buyNow);
        }
        
        init();
    </script>
</body>
</html>
